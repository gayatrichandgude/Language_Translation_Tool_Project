<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OCR Translation | AI Language Translator</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f7fc;
    font-family:'Segoe UI',sans-serif;
}

/* Header */
.page-title{
    color:#0d6efd;
    font-weight:700;
}

/* Card */
.ocr-card{
    background:white;
    border-radius:25px;
    padding:40px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

/* Image Preview */
.preview-box{
    border:2px dashed #0d6efd;
    border-radius:15px;
    padding:20px;
    text-align:center;
    background:#f8fafc;
}

.preview-box img{
    max-width:100%;
    max-height:300px;
    margin-top:10px;
    border-radius:10px;
}

/* Buttons */
.btn{
    border-radius:12px;
}

.floating-btn{
    position:fixed;
    top:25px;
    right:25px;
    width:55px;
    height:55px;
    border-radius:50%;
    background:white;
    color:#0d6efd;
    font-size:22px;
    box-shadow:0 8px 20px rgba(0,0,0,0.15);
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #e5e7eb;
}

.floating-btn:hover{
    transform:scale(1.1);
}

</style>
</head>

<body>

<a href="/dashboard" class="floating-btn">←</a>

<div class="container mt-5">

<div class="text-center mb-4">

<h1 class="page-title display-5">
OCR Text Extraction
</h1>

<p class="text-muted fs-5">
Upload an image and extract text using AI-powered OCR
</p>

</div>

<div class="ocr-card">

<form method="POST" enctype="multipart/form-data">

<!-- Upload -->
<div class="mb-4">
<label class="fw-bold mb-2">Upload Image</label>
<input type="file" name="image" id="imageInput" class="form-control" accept="image/*" required>
</div>

<!-- Preview -->
<div class="preview-box mb-4">
<p class="text-muted">Image Preview</p>
<img id="preview" />
</div>

<!-- Buttons -->
<div class="text-center mb-4">

<button type="submit" class="btn btn-primary btn-lg px-4">
🧠 Extract Text
</button>

</div>

<hr>

<!-- Output -->
<h4 class="fw-bold mb-3">📄 Extracted Text</h4>

<textarea
id="outputText"
class="form-control"
rows="8"
readonly
placeholder="Extracted text will appear here...">{{ ocr_text }}</textarea>

<div class="text-center mt-3">

<button type="button" class="btn btn-success me-2" onclick="copyText()">
📋 Copy
</button>

<button type="button" class="btn btn-danger" onclick="clearText()">
🗑 Clear
</button>

</div>

</form>

</div>
</div>

<script>

// Image Preview
document.getElementById("imageInput").addEventListener("change", function(event){

let reader = new FileReader();
reader.onload = function(){
    document.getElementById("preview").src = reader.result;
}
reader.readAsDataURL(event.target.files[0]);

});

// Copy text
function copyText(){
let text = document.getElementById("outputText");
text.select();
document.execCommand("copy");
alert("Copied successfully!");
}

// Clear text
function clearText(){
document.getElementById("outputText").value = "";
document.getElementById("imageInput").value = "";
document.getElementById("preview").src = "";
}

</script>

</body>
</html>
