<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Grammar Checker | AI Language Translator</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f7fc;
    font-family:'Segoe UI',sans-serif;
}

/* Title */
.page-title{
    color:#0d6efd;
    font-weight:700;
}

/* Card */
.grammar-card{
    background:white;
    border-radius:25px;
    padding:40px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

/* Textarea */
textarea{
    border-radius:12px;
    resize:none;
}

/* Buttons */
.btn{
    border-radius:12px;
}

/* Floating Back Button */
.floating-btn{
    position:fixed;
    top:25px;
    right:25px;
    width:55px;
    height:55px;
    border-radius:50%;
    background:white;
    color:#0d6efd;
    font-size:22px;
    box-shadow:0 8px 20px rgba(0,0,0,0.15);
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #e5e7eb;
}

.floating-btn:hover{
    transform:scale(1.1);
}

</style>

</head>

<body>

<a href="/dashboard" class="floating-btn">←</a>

<div class="container mt-5">

<!-- Header -->
<div class="text-center mb-4">

<h1 class="page-title display-5">
AI Grammar Checker
</h1>

<p class="text-muted fs-5">
Improve your sentences using AI-powered grammar correction
</p>

</div>

<!-- Card -->
<div class="grammar-card">

<form method="POST">

<!-- Input -->
<h4 class="fw-bold mb-3">✍️ Enter Your Text</h4>

<textarea
name="input_text"
class="form-control mb-4"
rows="6"
placeholder="Write your sentence here..."
required>{{ input_text }}</textarea>

<div class="text-center mb-4">

<button type="submit" class="btn btn-primary btn-lg px-4">
🤖 Check Grammar
</button>

</div>

<hr>

<!-- Corrected Output -->
<h4 class="fw-bold mb-3">✅ Corrected Text</h4>

<textarea
class="form-control mb-4"
rows="6"
readonly
placeholder="Corrected grammar text will appear here...">
{{ corrected_text }}
</textarea>

<!-- Improved Version -->
<h4 class="fw-bold mb-3">🚀 Improved Version (AI Enhanced)</h4>

<textarea
class="form-control"
rows="6"
readonly
placeholder="AI improved sentence...">
{{ improved_text }}
</textarea>

<!-- Buttons -->
<div class="text-center mt-4">

<button type="button" class="btn btn-success me-2" onclick="copyText()">
📋 Copy
</button>

<button type="button" class="btn btn-danger" onclick="clearText()">
🗑 Clear
</button>

</div>

</form>

</div>
</div>

<script>

// Copy both outputs
function copyText(){

let text1 = document.querySelectorAll("textarea")[1].value;
let text2 = document.querySelectorAll("textarea")[2].value;

let combined = "Corrected:\n" + text1 + "\n\nImproved:\n" + text2;

navigator.clipboard.writeText(combined);

alert("Copied successfully!");
}

// Clear fields
function clearText(){
document.querySelectorAll("textarea")[0].value = "";
document.querySelectorAll("textarea")[1].value = "";
document.querySelectorAll("textarea")[2].value = "";
}

</script>

</body>
</html>
