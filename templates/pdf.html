<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF Translator | AI Language Translator</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f7fc;
    font-family:'Segoe UI',sans-serif;
}

/* Title */
.page-title{
    color:#0d6efd;
    font-weight:700;
}

/* Card */
.pdf-card{
    background:white;
    border-radius:25px;
    padding:40px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

/* Textarea */
textarea{
    border-radius:12px;
    resize:none;
}

/* Buttons */
.btn{
    border-radius:12px;
}

/* Floating Back Button */
.floating-btn{
    position:fixed;
    top:25px;
    right:25px;
    width:55px;
    height:55px;
    border-radius:50%;
    background:white;
    color:#0d6efd;
    font-size:22px;
    box-shadow:0 8px 20px rgba(0,0,0,0.15);
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #e5e7eb;
}

.floating-btn:hover{
    transform:scale(1.1);
}

</style>

</head>

<body>

<a href="/dashboard" class="floating-btn">←</a>

<div class="container mt-5">

<!-- Header -->
<div class="text-center mb-4">

<h1 class="page-title display-5">
PDF Translator
</h1>

<p class="text-muted fs-5">
Upload PDF, extract text and translate it using AI
</p>

</div>

<!-- Main Card -->
<div class="pdf-card">

<form method="POST" enctype="multipart/form-data">

<!-- Upload -->
<div class="mb-4">
<label class="fw-bold mb-2">Upload PDF File</label>
<input type="file" name="pdf" class="form-control" accept="application/pdf" required>
</div>

<!-- Target Language -->
<div class="mb-4">
<label class="fw-bold mb-2">Select Target Language</label>

<select name="language" class="form-select">
<option value="hi">Hindi</option>
<option value="en">English</option>
<option value="mr">Marathi</option>
<option value="fr">French</option>
<option value="de">German</option>
<option value="es">Spanish</option>
<option value="gu">Gujarati</option>
<option value="ur">Urdu</option>
<option value="ta">Tamil</option>
<option value="kn">Kannada</option>
</select>

</div>

<!-- Submit -->
<div class="text-center mb-4">
<button type="submit" class="btn btn-primary btn-lg px-4">
🚀 Translate PDF
</button>
</div>

<hr>

<!-- Extracted Text -->
<h4 class="fw-bold mb-3">📄 Extracted Text</h4>

<textarea class="form-control mb-4" rows="7" readonly placeholder="PDF extracted text...">
{{ extracted_text }}
</textarea>

<!-- Translated Text -->
<h4 class="fw-bold mb-3">🌍 Translated Text</h4>

<textarea class="form-control" rows="7" readonly placeholder="Translated text...">
{{ translated_text }}
</textarea>

<!-- Buttons -->
<div class="text-center mt-4">

<button type="button" class="btn btn-success me-2" onclick="copyText()">
📋 Copy Translation
</button>

<button type="button" class="btn btn-danger" onclick="clearText()">
🗑 Clear
</button>

</div>

</form>

</div>
</div>

<script>

// Copy translated text
function copyText(){
let text = document.querySelectorAll("textarea")[1];
text.select();
document.execCommand("copy");
alert("Translation copied!");
}

// Clear fields
function clearText(){
document.querySelectorAll("textarea")[0].value = "";
document.querySelectorAll("textarea")[1].value = "";
}

</script>

</body>
</html>
