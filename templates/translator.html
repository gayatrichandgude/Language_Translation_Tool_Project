
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Language Translator</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f7fc;
    font-family:'Segoe UI',sans-serif;
    margin:0;
}


/* Content */

/* Content - FULL PAGE */
.content{
    padding:40px;
    width:100%;
    margin:0;
}

/* Card */

.translator-card{
    background:white;
    border-radius:25px;
    padding:40px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
    width:100%;
}

/* Inputs */

.form-control,
.form-select{
    border-radius:12px;
}

textarea{
    resize:none;
}

/* Buttons */

.btn{
    border-radius:12px;
}

/* Heading */

.page-title{
    color:#0d6efd;
    font-weight:700;
}

/* Stats */

.stats-card{
    border:none;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

@media(max-width:768px){

.sidebar{
    position:relative;
    width:100%;
    height:auto;
}

.content{
    margin-left:0;
    padding:20px;
}

}

.floating-btn{
    position:fixed;
    top:25px;
    right:25px;
    width:55px;
    height:55px;
    border-radius:50%;
    background:white;          /* 👈 white background */
    color:#0d6efd;             /* 👈 blue arrow */
    font-size:22px;
    box-shadow:0 8px 20px rgba(0,0,0,0.15);
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:0.3s;
    z-index:9999;
    border:1px solid #e5e7eb;  /* optional clean border */
}

.floating-btn:hover{
    transform:scale(1.1);
    background:#f8fafc;
}
</style>

</head>

<body>



<!-- Main Content -->

<div class="content">

<div class="text-center mb-5">

<h1 class="display-4 page-title">

Smart Language Translator

</h1>

<p class="text-muted fs-5">

Translate text instantly into multiple languages using Artificial Intelligence

</p>

<a href="/dashboard" class="floating-btn">
    ←
</a>

</div>

<!-- Translator Card -->
<form method="POST">
<div class="translator-card">

<h3 class="fw-bold mb-4">

Text Translation

</h3>

<textarea
name="text"
id="inputText"
class="form-control mb-4"
rows="6"
placeholder="Enter text here..."
required></textarea>

<div class="row">

<div class="col-md-5">

<label class="fw-bold mb-2">

Source Language

</label>

<select name="source" id="source" class="form-select">

<option value="auto">Auto Detect</option>
<option value="en">English</option>
<option value="hi">Hindi</option>
<option value="mr">Marathi</option>
<option value="fr">French</option>
<option value="de">German</option>
<option value="es">Spanish</option>
<option value="gu">Gujarati</option>
<option value="ur">Urdu</option>
<option value="kn">Kannada</option>
<option value="ta">Tamil</option>
</select>

</div>

<div class="col-md-2 text-center">

<button
class="btn btn-warning mt-4"
onclick="swapLanguages()">

⇄

</button>

</div>

<div class="col-md-5">

<label class="fw-bold mb-2">

Target Language

</label>

<select name="target" id="target" class="form-select">

<option value="hi">Hindi</option>
<option value="en">English</option>
<option value="mr">Marathi</option>
<option value="fr">French</option>
<option value="de">German</option>
<option value="es">Spanish</option>
<option value="gu">Gujarati</option>
<option value="ur">Urdu</option>
<option value="kn">Kannada</option>
<option value="ta">Tamil</option>
</select>

</div>

</div>

<div class="text-center mt-5">

<button
type="submit"
class="btn btn-primary btn-lg px-5">

🚀 Translate Now

</button>

</div>

<hr class="my-5">

<h4 class="fw-bold mb-3">

✅ Translation Result

</h4>

<textarea
id="outputText"
class="form-control"
rows="6"
readonly>{{ translated_text }}</textarea>
</form>
<div class="text-center mt-4">

<button
class="btn btn-success me-2"
onclick="copyText()">

📋 Copy

</button>

<button
class="btn btn-danger"
onclick="clearText()">

🗑 Clear

</button>

</div>

</div>


<!-- Information Cards -->

<div class="row mt-5">

<div class="col-md-4">

<div class="card stats-card text-center p-4">

<h2 class="text-primary">
100+
</h2>

<p>
Languages Supported
</p>

</div>

</div>

<div class="col-md-4">

<div class="card stats-card text-center p-4">

<h2 class="text-success">
99%
</h2>

<p>
Translation Accuracy
</p>

</div>

</div>

<div class="col-md-4">

<div class="card stats-card text-center p-4">

<h2 class="text-danger">
24/7
</h2>

<p>
Service Availability
</p>

</div>

</div>

</div>

</div>

<script>

function copyText(){

let copyText=document.getElementById("outputText");

copyText.select();

document.execCommand("copy");

alert("Translation copied successfully");

}

function clearText(){

document.getElementById("inputText").value="";

document.getElementById("outputText").value="";

}

function swapLanguages(){

let source=document.getElementById("source");
let target=document.getElementById("target");

let temp=source.value;

source.value=target.value;

target.value=temp;

}

</script>

</body>

</html>
